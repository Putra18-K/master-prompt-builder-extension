<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Master Prompt Builder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 3v4"/><path d="M21 5h-4"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></symbol>
    <symbol id="i-loader" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></symbol>
  </svg>

  <div id="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-spark"/></svg></span>
        <div class="brand-text">
          <h1>Master Prompt Builder</h1>
          <p id="currentRoomTitle" class="room-subtitle">Room baru</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="roomsToggleBtn" type="button" class="btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="roomsPanel">
          <svg class="icon" aria-hidden="true"><use href="#i-list"/></svg><span>Daftar room</span>
        </button>
        <button id="settingsToggleBtn" type="button" class="btn" aria-expanded="false" aria-controls="settingsPanel">
          <svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span>Pengaturan</span>
        </button>
      </div>
    </header>

    <section id="settingsPanel" class="settings" aria-label="Pengaturan API" hidden>
      <div class="field">
        <label for="apiKey">Gemini API key</label>
        <div class="key-row">
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza..." aria-describedby="keyHelp">
          <button id="toggleKeyBtn" type="button" class="icon-btn" aria-label="Tampilkan API key" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg>
          </button>
          <button id="clearKeyBtn" type="button" class="btn">Hapus</button>
        </div>
        <p id="keyHelp" class="help">Disimpan di penyimpanan lokal Chrome pada perangkat ini, tanpa enkripsi. Hanya dikirim ke generativelanguage.googleapis.com.</p>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="geminiModel">Model</label>
          <select id="geminiModel"></select>
        </div>
        <div class="field">
          <label for="effortLevel">Tingkat berpikir</label>
          <select id="effortLevel"></select>
        </div>
      </div>
    </section>

    <div id="chatBox" class="chat" role="log" aria-live="polite" aria-label="Percakapan penyusunan prompt" tabindex="0"></div>

    <footer class="composer">
      <p id="status" class="status" role="status" data-kind=""></p>
      <label for="userPrompt" class="sr-only">Instruksi, ide, atau revisi prompt</label>
      <textarea id="userPrompt" rows="3" placeholder="Tulis ide prompt, atau instruksi revisi untuk prompt terakhir..."></textarea>
      <div class="composer-row">
        <span class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> untuk kirim</span>
        <button id="sendBtn" type="button" class="btn btn-primary"></button>
      </div>
    </footer>
  </div>

  <div id="roomsPanel" class="rooms" role="dialog" aria-modal="true" aria-labelledby="roomsTitle" hidden>
    <div class="rooms-head">
      <h2 id="roomsTitle">Riwayat room</h2>
      <button id="closeRoomsBtn" type="button" class="icon-btn" aria-label="Tutup daftar room">
        <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
    <ul id="roomsList" class="rooms-list"></ul>
    <div class="rooms-foot">
      <button id="newRoomBtn" type="button" class="btn btn-primary btn-block">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span>Room baru</span>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
