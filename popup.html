<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Prompt Builder</title>
    <!-- Tailwind CSS CDN (v2.2.19) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* LUXURIOUS DARK THEME CUSTOMIZATION */
        :root {
            --bg-base: #050505;        /* Very dark obsidian */
            --bg-panel: #0a0a0a;       /* Dark gray for panels */
            --bg-overlay: #050505;     /* Solid dark for overlay (Fixing the overlap issue) */
            --bg-bubble-ai: #121212;
            --border-soft: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(99, 102, 241, 0.3);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
        }

        body { 
            width: 600px; 
            height: 600px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            position: relative;
            margin: 0;
            overflow: hidden;
        }

        /* Glass & Panel Styles */
        .lux-panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-soft);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        .lux-overlay {
            background-color: var(--bg-overlay);
            z-index: 50;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        /* Typography & Glow */
        .text-gradient {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(99,102,241,0.2);
        }
        
        .btn-lux {
            background: var(--accent-gradient);
            box-shadow: 0 2px 15px rgba(99, 102, 241, 0.25);
            transition: all 0.2s ease;
        }
        .btn-lux:hover {
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            transform: translateY(-1px);
        }

        pre { font-family: 'Consolas', monospace; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body class="p-4">

    <!-- Header -->
    <header class="pb-3 mb-3 flex justify-between items-center shrink-0 border-b" style="border-color: var(--border-soft);">
        <div class="flex items-center space-x-3">
            <div class="p-2 rounded-xl" style="background: var(--accent-gradient);">
                <i class="fa-solid fa-wand-magic-sparkles text-white drop-shadow-md"></i>
            </div>
            <div>
                <h1 class="text-base font-bold text-gradient">Master Prompt Builder</h1>
                <p id="currentRoomTitle" class="text-[10px]" style="color: var(--text-muted);">Room Chat Aktif...</p>
            </div>
        </div>
        <div class="flex space-x-2">
            <button id="roomsToggleBtn" class="flex items-center space-x-1 text-[10px] px-2.5 py-1.5 rounded-lg border transition hover:bg-white/5" style="border-color: var(--border-soft); color: #818cf8;">
                <i class="fa-solid fa-list-ul"></i>
                <span>Daftar Room</span>
            </button>
            <button id="settingsToggleBtn" class="flex items-center space-x-1 text-[10px] px-2.5 py-1.5 rounded-lg border transition hover:bg-white/5" style="border-color: var(--border-soft); color: var(--text-muted);">
                <i class="fa-solid fa-sliders"></i>
                <span>API</span>
            </button>
        </div>
    </header>

    <!-- OVERLAY DAFTAR ROOM (FIXED OVERLAP & SOLID BACKGROUND) -->
    <div id="roomsPanel" class="hidden absolute inset-0 lux-overlay flex flex-col p-5 transition-opacity duration-200">
        <div class="flex justify-between items-center pb-3 border-b" style="border-color: var(--border-soft);">
            <h2 class="text-sm font-semibold flex items-center gap-2" style="color: #818cf8;">
                <i class="fa-regular fa-comments"></i> Riwayat Room Chat
            </h2>
            <button id="closeRoomsBtn" class="hover:text-white transition" style="color: var(--text-muted);"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        
        <!-- List Room -->
        <div id="roomsContainer" class="flex-grow overflow-y-auto space-y-2 mt-4 mb-4 pr-1">
            <!-- Room items injected here -->
        </div>

        <!-- Tombol Room Baru -->
        <div class="pt-4 border-t shrink-0" style="border-color: var(--border-soft);">
            <button id="createNewRoomBtn" class="w-full font-medium py-2.5 rounded-lg text-xs flex justify-center items-center space-x-2 transition border" style="background-color: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.3); color: #a5b4fc;">
                <i class="fa-solid fa-plus"></i>
                <span>Buat Room Chat Baru</span>
            </button>
        </div>
    </div>

    <!-- Settings Panel (Panel Dropdown) -->
    <div id="settingsPanel" class="hidden lux-panel p-4 rounded-xl space-y-3 mb-3 shrink-0 absolute left-4 right-4 top-16 z-40">
        <div class="flex justify-between items-center border-b pb-2" style="border-color: var(--border-soft);">
            <h2 class="text-sm font-semibold flex items-center gap-2" style="color: #818cf8;"><i class="fa-solid fa-gear"></i> Konfigurasi API</h2>
            <button id="closeSettingsBtn" class="hover:text-white transition" style="color: var(--text-muted);"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="space-y-2">
            <div class="relative">
                <input type="password" id="apiKey" placeholder="Gemini API Key (AIzaSy...)" class="w-full rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1" style="background-color: #000; border: 1px solid var(--border-soft); color: white; border-color: var(--border-soft);">
                <button type="button" id="toggleEyeBtn" class="absolute right-3 top-2" style="color: var(--text-muted);">
                    <i id="eyeIcon" class="fa-solid fa-eye"></i>
                </button>
            </div>
            <div class="flex space-x-2 pt-1">
                <select id="geminiModel" class="w-1/2 rounded-lg px-2 py-1.5 text-[10px]" style="background-color: #000; border: 1px solid var(--border-soft); color: white;">
                    <option value="gemini-3.5-flash-lite">3.5 Flash-Lite</option>
                    <option value="gemini-3.6-flash" selected>3.6 Flash</option>
                    <option value="gemini-3.1-pro">3.1 Pro</option>
                </select>
                <select id="effortLevel" class="w-1/2 rounded-lg px-2 py-1.5 text-[10px]" style="background-color: #000; border: 1px solid var(--border-soft); color: white;">
                    <option value="MEDIUM">Medium Effort</option>
                    <option value="HIGH">High Effort</option>
                    <option value="LOW">Low Effort</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Chat Box Area -->
    <div id="chatBox" class="flex-grow lux-panel rounded-xl p-4 mb-3 overflow-y-auto flex flex-col space-y-4">
        <!-- Bubbles injected here -->
    </div>

    <!-- Input Area -->
    <div class="shrink-0 lux-panel rounded-xl p-3 flex flex-col space-y-2">
        <textarea id="userPrompt" rows="2" placeholder="Ketik instruksi, ide, atau revisi prompt di sini..." class="w-full rounded-lg p-2.5 text-xs focus:outline-none resize-none transition" style="background-color: #000; border: 1px solid var(--border-soft); color: white;"></textarea>
        <div class="flex justify-between items-center">
            <span class="text-[10px]" style="color: var(--text-muted);">Tekan <kbd class="px-1.5 py-0.5 rounded bg-gray-800 border border-gray-700">Ctrl</kbd> + <kbd class="px-1.5 py-0.5 rounded bg-gray-800 border border-gray-700">Enter</kbd> untuk Kirim</span>
            <button id="generateBtn" class="btn-lux text-white font-medium px-4 py-1.5 rounded-lg text-xs flex items-center space-x-2 cursor-pointer">
                <i id="btnIcon" class="fa-solid fa-paper-plane"></i>
                <span id="btnText">Kirim</span>
            </button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
